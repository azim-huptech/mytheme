<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mens hero banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1e"/>
      <stop offset="0.55" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#3a2e24"/>
    </linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8a46a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c8a46a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="weave" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="transparent"/>
      <path d="M0 11h22M11 0v22" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="900" fill="url(#bg)"/>
  <rect width="1920" height="900" fill="url(#weave)"/>
  <circle cx="1480" cy="320" r="520" fill="url(#spot)"/>
  <!-- silhouette: tailored jacket -->
  <g transform="translate(1180,230)" fill="#0b0b0d">
    <path d="M160 0 l-90 60 -160 60 0 540 500 0 0 -540 -160 -60 z" opacity="0.85"/>
    <path d="M160 0 l-50 120 50 60 50 -60 z" fill="#17171b"/>
    <path d="M85 160 l75 120 75 -120" stroke="#1f1f24" stroke-width="3" fill="none"/>
    <!-- pocket square -->
    <rect x="195" y="225" width="35" height="14" fill="#c8a46a"/>
    <!-- buttons -->
    <circle cx="160" cy="300" r="4" fill="#c8a46a"/>
    <circle cx="160" cy="360" r="4" fill="#c8a46a"/>
    <circle cx="160" cy="420" r="4" fill="#c8a46a"/>
  </g>
  <!-- ground shadow -->
  <ellipse cx="1340" cy="820" rx="440" ry="30" fill="rgba(0,0,0,0.45)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
